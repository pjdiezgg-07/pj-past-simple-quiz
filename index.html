<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Simple Challenge</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4326a8, #7945db);
  color: white;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
}
.game {
  background: white;
  color: #252344;
  width: 100%;
  max-width: 650px;
  padding: 28px;
  border-radius: 24px;
  box-shadow: 0 12px 35px #20105b55;
}
h1 { text-align: center; color: #592fc1; margin-top: 0; }
.meta { display:flex; justify-content:space-between; gap:10px; font-weight:bold; }
.track { height: 9px; background:#e7e3f5; border-radius:9px; margin:18px 0; overflow:hidden; }
#bar { height:100%; background:#8052e8; width:0%; transition:width .3s; }
#question { font-size:1.35rem; line-height:1.4; min-height:65px; }
.answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0; }
button {
  border:0; border-radius:12px; padding:15px 12px;
  font-size:1rem; font-weight:bold; cursor:pointer;
  transition:transform .12s, opacity .12s;
}
button:hover:not(:disabled) { transform:translateY(-2px); }
.answer { color:#292342; background:#eee9fb; border:2px solid transparent; }
.answer:disabled { cursor:default; opacity:1; }
.answer.correct { background:#d5f7e3; border-color:#25a55b; }
.answer.wrong { background:#ffe0e0; border-color:#df4c55; }
#feedback { min-height:48px; line-height:1.5; font-weight:bold; }
.main-btn { background:#6138cb; color:white; width:100%; margin-top:10px; }
.small { color:#716c83; text-align:center; font-size:.9rem; }
#result { text-align:center; }
#result h2 { color:#592fc1; font-size:2rem; }
.hidden { display:none; }

.input-group { margin: 20px 0; text-align: left; }
.input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #592fc1; }
.input-group input {
  width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 12px; font-size: 1rem; outline: none;
}
.input-group input:focus { border-color: #6138cb; }

@media(max-width:430px) {
  .game { padding:20px; }
  .answers { grid-template-columns:1fr; }
  #question { font-size:1.2rem; }
}
</style>
</head>
<body>
<main class="game">
  <!-- Pantalla de Inicio -->
  <section id="login">
    <h1>🎮 Past Simple Challenge</h1>
    <p class="small">Ingresa tu nombre para comenzar la partida</p>
    <div class="input-group">
      <label for="studentName">Nombre y Apellido:</label>
      <input type="text" id="studentName" placeholder="Ej. Ana Pérez" autocomplete="off">
    </div>
    <button class="main-btn" onclick="initQuiz()">¡Empezar a Jugar! 🚀</button>
  </section>

  <!-- Pantalla del Quiz -->
  <section id="quiz" class="hidden">
    <h1>🎮 Past Simple Challenge</h1>
    <p class="small" id="welcomeUser"></p>
    <div class="meta">
      <span id="counter">Question 1 / 13</span>
      <span>⭐ <span id="score">0</span> points</span>
    </div>
    <div class="track"><div id="bar"></div></div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <p id="feedback" aria-live="polite"></p>
    <button class="main-btn" id="next" disabled>Next question →</button>
  </section>

  <!-- Pantalla de Resultados -->
  <section id="result" class="hidden">
    <h1>🏆 Challenge complete!</h1>
    <h2 id="finalScore"></h2>
    <p id="message"></p>
    <p id="details"></p>
    <button class="main-btn" onclick="restart()">🔄 Jugar de nuevo</button>
  </section>
</main>

<script>
const questions = [
  {q:"What is the past of BE?",a:["Beed","Was / Were","Been","Being"],c:1,e:"Be → was / were."},
  {q:"Yesterday, I ___ at home.",a:["am","were","was","be"],c:2,e:"With I, use was."},
  {q:"What is the past of LIVE?",a:["Lived","Liveed","Lives","Living"],c:0,e:"Live → lived."},
  {q:"She ___ in a concert last year.",a:["sing","sang","sung","sings"],c:1,e:"Sing → sang."},
  {q:"We ___ to the beach last Sunday.",a:["goed","go","went","gone"],c:2,e:"Go → went."},
  {q:"I ___ English last night.",a:["learn","learned","learning","learns"],c:1,e:"Learn → learned."},
  {q:"They ___ to Mexico last summer.",a:["travel","traveled","travels","traveling"],c:1,e:"Travel → traveled."},
  {q:"The movie ___ at 7 p.m. yesterday.",a:["start","startted","started","starts"],c:2,e:"Start → started."},
  {q:"He ___ pizza yesterday.",a:["eated","ate","eats","eaten"],c:1,e:"Eat → ate."},
  {q:"We ___ a great time at the party.",a:["have","has","had","having"],c:2,e:"Have → had."},
  {q:"Did you ___ the trip?",a:["enjoyed","enjoy","enjoying","enjoys"],c:1,e:"After did, use base form: enjoy."},
  {q:"My mother ___ a new dress yesterday.",a:["buy","buyed","bought","buys"],c:2,e:"Buy → bought."},
  {q:"She ___ a letter yesterday.",a:["wrote","write","written","writed"],c:0,e:"Write → wrote."}
];

let order = [], current = 0, points = 0, answered = false, currentStudent = "";
const $ = id => document.getElementById(id);

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initQuiz() {
  const nameInput = $("studentName").value.trim();
  if (!nameInput) {
    alert("Por favor, escribe tu nombre para continuar.");
    return;
  }
  currentStudent = nameInput;
  $("welcomeUser").textContent = `Player: ${currentStudent}`;
  
  order = shuffle(questions.map((_, i) => i));
  current = 0;
  points = 0;
  
  $("login").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("result").classList.add("hidden");
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[order[current]];
  $("counter").textContent = `Question ${current + 1} / ${questions.length}`;
  $("score").textContent = points;
  $("bar").style.width = `${(current / questions.length) * 100}%`;
  $("question").textContent = q.q;
  $("feedback").textContent = "";
  $("next").disabled = true;
  $("next").textContent = current === questions.length - 1
    ? "See my results 🏆" : "Next question →";
  
  // Limpiar contenedor de respuestas de forma compatible
  $("answers").innerHTML = "";

  q.a.forEach((answer, i) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = `${String.fromCharCode(65+i)}. ${answer}`;
    btn.onclick = () => chooseAnswer(i);
    $("answers").appendChild(btn);
  });
}

function chooseAnswer(choice) {
  if (answered) return;
  answered = true;
  const q = questions[order[current]];
  const buttons = [...$("answers").children];

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.c) btn.classList.add("correct");
    else if (i === choice) btn.classList.add("wrong");
  });

  if (choice === q.c) {
    points += 100;
    $("feedback").textContent = "✅ Correct! " + q.e;
    $("feedback").style.color = "#168348";
  } else {
    $("feedback").textContent = "❌ Not quite. " + q.e;
    $("feedback").style.color = "#c13845";
  }

  $("score").textContent = points;
  $("bar").style.width = `${((current + 1) / questions.length) * 100}%`;
  $("next").disabled = false;
}

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current < questions.length) showQuestion();
  else finishGame();
}

function finishGame() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  
  const correct = points / 100;
  $("finalScore").textContent = `${correct} / ${questions.length} correct`;
  $("message").textContent =
    correct === 13 ? "Perfect score! Excellent work! 🌟" :
    correct >= 10 ? "Great job! Keep practicing! 🎉" :
    correct >= 7 ? "Good effort! Review the verbs and try again. 💪" :
    "Keep going! Practice makes progress. 📚";
  $("details").textContent = `Your score: ${points} / 1300 points`;
  $("bar").style.width = "100%";

  // Enviar a Google Sheets
  saveResult(currentStudent, correct, points);
}

function saveResult(name, correctAnswers, totalPoints) {
  const resultRecord = {
    name: name,
    score: correctAnswers + "/13",
    points: totalPoints,
    date: new Date().toLocaleString()
  };

  // Pega aquí tu URL actualizada de Google Apps Script
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSwobbKFCG0hTwYzZ5_cbLKx7A1lXNgKbjt_yi77SZJ6kKFSiUGcDwtFOhx9tPLjYp/exec";

  // Usamos navigator.sendBeacon o fetch con no-cors para evitar bloqueos del navegador local
  if (WEB_APP_URL.includes("script.google.com")) {
    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" }, // 'text/plain' evita el bloqueo pre-flight de CORS en Google
      body: JSON.stringify(resultRecord)
    })
    .then(() => console.log("Datos enviados con éxito"))
    .catch(error => console.error("Error al guardar:", error));
  }
}
function restart() { 
  $("studentName").value = "";
  $("login").classList.remove("hidden");
  $("result").classList.add("hidden");
}

$("next").addEventListener("click", nextQuestion);
</script>
</body>
</html>
